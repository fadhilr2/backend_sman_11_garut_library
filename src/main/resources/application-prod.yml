server:
  port: 8080
  address: 127.0.0.1 # Strictly bound to localhost behind Nginx

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/library?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Jakarta
    username: ${DB_USERNAME:library}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

app:
  storage:
    root: /mnt/library/files
    import-dir: /mnt/library/import
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoint:
    health:
      show-details: never

# API docs are for the front-end team during development; not served in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  file:
    name: /var/log/sman11-library/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14